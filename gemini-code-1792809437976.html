<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AudioVault - Colección de Música</title>
    <link rel="manifest" href="data:application/json;choice=pwa,base64,ewogICJuYW1lIjogIkF1ZGlvVmF1bHQgTWVkaWEiLAogICJzaG9ydF9uYW1lIjogIkF1ZGlvVmF1bHQiLAogICJzdGFydF91cmwiOiAiLi8iLAogICJkaXNwbGF5IjogInN0YW5kYWxvbmUiLAogICJiYWNrZ3JvdW5kX2NvbG9yIjogIiMwZjE3MmEiLAogICJ0aGVtZV9jb2xvciI6ICIjNmQyOGQ5Igp9">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        .album-card { perspective: 1000px; }
        .album-inner { transition: transform 0.6s; transform-style: preserve-3d; }
        .album-card.flipped .album-inner { transform: rotateY(180deg); }
        .album-front, .album-back { backface-visibility: hidden; }
        .album-back { transform: rotateY(180deg); }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-20 select-none">

    <!-- BARRA SUPERIOR -->
    <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700 sticky top-0 z-30 px-4 py-3 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-indigo-600 rounded-full flex items-center justify-center text-xl shadow-lg">
                <i class="fa-solid font-bold fa-compact-disc animate-spin-slow"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight">AudioVault</h1>
                <p class="text-xs text-slate-400">Colección de Música</p>
            </div>
        </div>
        <div class="flex gap-2">
            <button onclick="openScanner()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 shadow">
                <i class="fa-solid fa-qrcode"></i> <span class="hidden sm:inline">Escanear</span>
            </button>
            <button onclick="openModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 shadow">
                <i class="fa-solid fa-plus"></i> <span class="hidden sm:inline">Nuevo Disco</span>
            </button>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="max-w-6xl mx-auto p-4">
        <!-- BUSCADOR Y FILTROS -->
        <div class="mb-6 flex flex-col sm:flex-row gap-3">
            <div class="relative flex-1">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-slate-400"></i>
                <input type="text" id="searchInput" oninput="filterCollection()" placeholder="Buscar por artista, álbum o tema..." class="w-full bg-slate-800 border border-slate-700 rounded-lg pl-10 pr-4 py-2 text-sm focus:outline-none focus:border-indigo-500">
            </div>
            <select id="formatFilter" onchange="filterCollection()" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                <option value="ALL">Todos los Formatos</option>
                <option value="Vinilo">Vinilo</option>
                <option value="CD">CD</option>
                <option value="MP3">MP3</option>
                <option value="Cassette">Cassette</option>
            </select>
        </div>

        <!-- GRILLA DE DISCOS -->
        <div id="albumGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </main>

    <!-- MODAL ESCÁNER CON CÁMARA TRASERA -->
    <div id="scannerModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-5 relative text-center">
            <button onclick="closeScanner()" class="absolute top-3 right-3 text-slate-400 hover:text-white text-xl">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h3 class="text-lg font-bold mb-3"><i class="fa-solid fa-camera mr-2"></i>Escanear Código de Barras</h3>
            <div id="reader" class="overflow-hidden rounded-xl bg-black min-h-[250px] mb-4"></div>
            <p class="text-xs text-slate-400 mb-3">Apunta la cámara trasera al código de barras del disco.</p>
            <button onclick="switchCamera()" class="bg-slate-700 hover:bg-slate-600 text-white text-xs px-4 py-2 rounded-lg">
                <i class="fa-solid fa-camera-rotate mr-1"></i> Cambiar Cámara
            </button>
        </div>
    </div>

    <!-- MODAL AGREGAR / EDITAR DISCO -->
    <div id="albumModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-lg w-full p-6 relative my-8">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h2 id="modalTitle" class="text-xl font-bold mb-4">Agregar Nuevo Disco</h2>
            
            <form id="albumForm" onsubmit="saveAlbum(event)" class="space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Título del Álbum *</label>
                        <input type="text" id="albumTitle" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm focus:border-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Artista / Banda *</label>
                        <input type="text" id="albumArtist" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm focus:border-indigo-500 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Año</label>
                        <input type="number" id="albumYear" placeholder="1973" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm focus:border-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Formato</label>
                        <select id="albumFormat" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm focus:border-indigo-500 outline-none">
                            <option value="Vinilo">Vinilo</option>
                            <option value="CD">CD</option>
                            <option value="MP3">MP3</option>
                            <option value="Cassette">Cassette</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Género</label>
                        <input type="text" id="albumGenre" placeholder="Rock, Fol" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm focus:border-indigo-500 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">URL Carátula Frontal</label>
                    <input type="url" id="albumCoverFront" placeholder="https://..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm focus:border-indigo-500 outline-none">
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">URL Carátula Trasera</label>
                    <input type="
